services:
  lgtm:
    image: ${LGTM_IMAGE:-grafana/otel-lgtm:latest}
    restart: unless-stopped
    # DinD: "host" — binds to devcontainer's localhost directly.
    # DooD: "container:<id>" — joins devcontainer's network namespace.
    # Either way localhost:4318 and :3000 work from inside the devcontainer.
    network_mode: ${LGTM_NETWORK_MODE:-host}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
    volumes:
      - /lgtm-data:/data
